on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

name: Release

jobs:
  release-please:
    runs-on: ubuntu-22.04
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag_name: ${{ steps.release.outputs.tag_name }}

  release-build:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    name: Release build
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    secrets: inherit

  release:
    runs-on: ubuntu-22.04
    needs: [release-please, release-build]
    name: Release
    env:
      tag_name: ${{ needs.release-please.outputs.release_tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: rime-wanxiang-dist-${{ github.ref_name }}

      - name: Generate release note
        run: bash .github/workflows/scripts/generate-release-note.sh

      - name: Update release note
        run: |
          gh release upload ${{ env.tag_name }} ./dist/rime-wanxiang-*.zip
          gh release edit ${{ env.tag_name }} --notes-file ./release_notes.md
