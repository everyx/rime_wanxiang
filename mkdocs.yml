site_name: 万象拼音
site_url: https://amzxyz.github.io/wanxiang/
site_description: 一个为提升rime拼音输入体验及生态构建的数据方案

repo_url: https://github.com/amzxyz/rime_wanxiang
repo_name: amzxyz/rime_wanxiang

theme:
  name: material
  #logo: material/leaf       # <--- 比如这里加个叶子的图标作为顶栏 Logo
  favicon: material/leaf
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  
  features:
    - navigation.tabs              # 开启顶部一级大标签导航
    #- navigation.sections          # 侧边栏分段展示 (重要)
    - navigation.expand            # 默认展开所有分类目录
    - navigation.indexes           # 允许点击目录组的名称
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate        # 允许在代码块旁边加气泡注释

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list                      # <--- 必须开启：允许给元素加自定义样式类
  - md_in_html                     # <--- 必须开启：允许在 HTML(div) 里写 Markdown
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:                # <--- 必须开启：渲染 Material 图标
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 万象功能分类体系
nav:
  - 🏠 首页: index.md
  
  - 🚀 快速上手:
        - 方案介绍与版本对比: guide/intro.md
        - 🪟 Windows:
            - Weasel (小狼毫): guide/weasel.md
        - 🍎 macOS:
            - Squirrel (鼠须管): guide/squirrel.md
            - Fcitx5-macOS （小企鹅）: guide/fcitx5-mac.md
        - 🐧 Linux:
            - Fcitx5-Linux （小企鹅）: guide/fcitx5-linux.md
            - ibus-rime: guide/ibus-rime.md
        - 📱 iOS:
            - Hamster (仓输入法): guide/hamster.md
            - Hamster3 (元书输入法): guide/hamster3.md
        - 🤖 Android:
            - Trime (同文输入法): guide/trime.md
            - Fcitx5-Android: guide/fcitx5-android.md
        - ⭕ 鸿蒙 HarmonyOS NEXT:
            - 超越输入法: guide/chaoyue.md
        - ⚙️ 进阶安装:
            - 使用万象工具链: guide/tools.md
            - 使用东风破 Plum: guide/plum.md
            - 手动设置: guide/manual.md
      
  - ⌨️ 核心输入体系:
      - 辅助码系统全解: core/aux_code.md     # 包含直接/间接辅码、候选筛选、输入前反查、声调辅查
      - 中英混输与独立英文: core/english_mixed.md
      - 14/18键特殊键盘转写: core/t9_layouts.md
      - 错音错字与造词系统: core/word_creation.md # 包含按需造词、无感造词、错音提示
      
  - 🪄 超强 Lua 魔法扩展:
      - ⏱️ 时间日期: guide/shijian.md    # 包含节气节日、/rc日期差、V计算器
      - 💡 智能提示与 Tips: lua/super_tips.md       # 包含超级Tips、超级注释、音调显示、字符集过滤
      - ✍️ 符号与排版: lua/symbols_format.md        # 包含快符a/、成对符号包裹\a、短语格式化、金额大写
      - 🎮 键盘与候选控制: lua/keyboard_control.md  # 包含手动排序、候选切割机、Tab切换、小键盘妙用、锁定语句(F1)
      - 🔄 超级替换 (Super Replacer): guide/super_replacer.md # 专属完整说明书
      
  - 🛠️ 进阶配置与数据:
      - rime工作机制: guide/Rime设计逻辑与配置哲学.md
      - Custom 补丁机制: advanced/custom_patch.md   # 教学如何安全打补丁
      - 词库与数据管理: advanced/data_dict.md       # txt数据位置、线上数据扩展、自定义词库迁移
      - 万能斜杠 / 机制拆解: advanced/slash_commands.md
      
  - 🌍 生态与附录:
      - 万象双拼键位图: appendix/wanxiang_shuangpin.md
      - 衍生方案与鸣谢: appendix/ecosystem.md
      - 赞赏支持: appendix/donate.md

